[package]
name = "costerra-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
costerra = { path = ".." }
libfuzzer-sys = "0.4.13"

# Not a member of costerra's workspace: built with `cargo fuzz` (nightly).
[workspace]
members = ["."]

[[bin]]
name = "parse_module"
path = "fuzz_targets/parse_module.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false
bench = false
