# cargo-deny: licences, advisories, banned and duplicate crates, sources.
# Run with `just deny` (also part of `just audit` and CI).

[graph]
all-features = false

[advisories]
# RustSec advisories (vulnerabilities, unmaintained, unsound, yanked).
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences compatible with distributing costerra under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # option-ext (via dirs): file-level copyleft, used unmodified.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
