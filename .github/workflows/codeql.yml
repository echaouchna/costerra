name: CodeQL

on:
  push:
    branches: [main]
    # Docs and site only: nothing to build, test or scan (the site has its own workflow).
    paths-ignore: &docs
      - "site/**"
      - "docs/**"
      - "**.md"
      - LICENSE
      - NOTICE
  pull_request:
    paths-ignore: *docs
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

# A newer push supersedes the analysis in progress (5 minutes for Rust).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
