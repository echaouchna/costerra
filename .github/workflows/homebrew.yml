# Homebrew formula from the archives built in the calling run (costerra-*
# artifacts), pushed to the tap named by the repository variable HOMEBREW_TAP
# (for example echaouchna/homebrew-tap) with the secret HOMEBREW_TAP_TOKEN
# (fine-grained token: Contents read and write on that repository only).
#
#   brew install echaouchna/tap/costerra
name: homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the archives are attached to (v1.2.3)
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: costerra-*
          merge-multiple: true
      - name: Formula from the checksums of the built targets
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          url="https://github.com/${REPO}/releases/download/${TAG}/costerra-${TAG}"
          sha() { # checksum of a target's archive, empty if it was not built
            local f="dist/costerra-${TAG}-$1.tar.gz"
            [ -f "$f" ] && sha256sum "$f" | cut -d' ' -f1 || true
          }
          cpu() { # on_arm / on_intel, if the target was built
            local s
            s=$(sha "$2")
            [ -z "$s" ] || printf '    %s do\n      url "%s-%s.tar.gz"\n      sha256 "%s"\n    end\n' "$1" "$url" "$2" "$s"
          }
          os() { # on_macos / on_linux with the CPUs that were built
            [ -n "$(sha "$2")$(sha "$3")" ] || return 0
            printf '\n  on_%s do\n' "$1"
            cpu on_arm "$2"
            cpu on_intel "$3"
            printf '  end\n'
          }
          {
            printf '# Generated by the release workflow of https://github.com/%s. Do not edit.\n' "$REPO"
            printf 'class Costerra < Formula\n'
            printf '  desc "Fast cost estimates and optimization insights for Google Cloud Terraform & Terragrunt"\n'
            printf '  homepage "https://costerra.echaouchna.dev/"\n'
            # The target triple in the archive names confuses Homebrew's version parser.
            printf '  version "%s"\n' "$version"
            printf '  license "Apache-2.0"\n'
            printf '\n  livecheck do\n    url :stable\n    strategy :github_latest\n  end\n'
            os macos aarch64-apple-darwin x86_64-apple-darwin
            os linux aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
            printf '\n  def install\n'
            printf '    bin.install "costerra"\n'
            printf '  end\n'
            printf '\n  test do\n'
            printf '    assert_match version.to_s, shell_output("#{bin}/costerra --version")\n'
            printf '  end\n'
            printf 'end\n'
          } > costerra.rb
          cat costerra.rb
      # Credentials are kept for the push below (to the tap only).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit and push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p tap/Formula
          cp costerra.rb tap/Formula/costerra.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/costerra.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "costerra ${TAG#v}"
          git push
