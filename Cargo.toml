[package]
name = "costerra"
version = "0.3.0"
edition = "2024"
description = "Fast cost estimates and optimization insights for Google Cloud Terraform & Terragrunt"
license = "Apache-2.0"
authors = ["Nabil Echaouch"]
rust-version = "1.89"
repository = "https://github.com/echaouchna/costerra"
homepage = "https://costerra.echaouchna.dev/"
readme = "README.md"
keywords = ["terraform", "terragrunt", "gcp", "finops", "cost"]
categories = ["command-line-utilities", "development-tools"]
# Published crate: sources, embedded data and docs (tests and fixtures stay in the repository).
include = ["/src/**/*.rs", "/data/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7.0.0"
fastrand = "2.5.0"
flate2 = "1.1.10"
futures = "0.3.34"
gcp_auth = "0.12.7"
globset = "0.4.20"
hcl-rs = "0.19"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["use-std"], default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "blocking"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
terminal_size = "0.4.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
zstd = "0.14.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release code with symbols, for profilers (`just profile`, `just mem`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# Keep target/ small: tests and clippy use this profile (only the shipped
# binary is built in release). Backtraces keep file:line for costerra code;
# dependencies carry no debug info; no incremental cache (re-enable locally
# with CARGO_INCREMENTAL=1 if you prefer faster rebuilds over disk space).
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
opt-level = 1
