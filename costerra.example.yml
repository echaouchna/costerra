# costerra configuration (place as costerra.yml at the repository root)
default_region: europe-west1
currency: USD
# Contract prices (negotiated discounts): the billing account is detected from
# the projects in your code; set it explicitly, or `none` for list prices only.
# Requires Billing Account Viewer.
# billing_account: 012345-6789AB-CDEF01
# refresh_prices: true   # re-fetch prices of used SKUs on every run (~2-3 s)
usage_file: costerra-usage.yml
exclude_paths:
  - "examples/**"

# Tokens matched against project paths, GCP project ids and `env` labels.
environments:
  nonprod: [dev, test, staging, sandbox, qa, uat]
  prod: [prod, production]

projects:
  - match: "live/prod/**"
    env: prod

recommendations:
  disabled: []          # e.g. [region-cheaper, compute-cud]

# Observed usage of the deployed resources (last 30 days of Cloud Monitoring
# metrics, active commitments): fills usage keys the usage file does not set
# and makes recommendations data-based. Needs Monitoring Viewer and Compute
# Viewer on the projects; skipped when not available.
# observed_usage: true
# quota_project: my-project   # quota project for the Recommender and Monitoring APIs, and project of the --billing-history query

# Detailed Cloud Billing export table read by --billing-history (weekly actual
# billing of the resources of the code). Default: discovered in the
# organization of the projects.
# billing_export_table: my-billing.billing.gcp_billing_export_resource_v1_012345_6789AB_CDEF01

# terraform_remote_state (gcs backend) outputs read from the state buckets
# (Storage Object Viewer), e.g. for project ids taken from another configuration.
# remote_state: true
# Run every Google API call as this service account (needs Service Account
# Token Creator on it).
# impersonate_service_account: costerra@my-project.iam.gserviceaccount.com

policies:
  max_monthly_cost: 50000
  max_increase: 1000          # per diff, absolute
  max_increase_percent: 15    # per diff, relative
